# Site information, not reader submissions.
quick_answers:
  - question: "Where should I start with the books?"
    answer: >-
      The Chosen begins The Chosen Chronicles. You can [read its first chapter](/chapters/the-chosen/chapter-01/) or use the [Books & Reading Guide](/writing/) to explore the stories. The timeline shows the order of events in the world; it isn’t a required reading order.
  - question: "What’s happening with The Silence?"
    answer: >-
      The Silence is undergoing a major rewrite and will be re-released soon. Its refreshed cover is already here. Visit the [Books page](/writing/#silence-update) for the current update.
  - question: "Where can I listen to the music?"
    answer: >-
      The [Music page](/music/) brings together my releases and listening links, including the soundtracks for The Silence and The Chosen.
  - question: "Will my question or message be made public?"
    answer: >-
      Questions sent through Askbox stay out of the public Q&A until answered. Choose Anonymous before sending if you don’t want your name displayed. For a personal conversation that won’t be included in the Q&A, use the private-message form on this page.
